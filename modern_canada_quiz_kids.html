<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Modern Canada Quiz - PDF Validated</title>
<style>
:root {
  --bg:#fff7df; --card:#ffffff; --ink:#203040; --accent:#ff8f3d; --good:#2fa866; --bad:#e05252; --blue:#4f8cff;
}
* { box-sizing:border-box; }
body {
  margin:0; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: radial-gradient(circle at top left,#dff4ff,transparent 30%), var(--bg);
  color:var(--ink);
}
header {
  padding:28px 18px; text-align:center; background:linear-gradient(135deg,#ffcf6e,#ff8f3d);
  border-bottom:6px solid #ffdca3;
}
h1 { margin:0; font-size:clamp(2rem,5vw,3.5rem); }
.subtitle { font-size:1.1rem; margin-top:8px; font-weight:700; }
.wrap { max-width:920px; margin:24px auto; padding:0 16px 40px; }
.panel, .question-card {
  background:var(--card); border-radius:24px; padding:22px; box-shadow:0 8px 0 rgba(0,0,0,.08), 0 14px 30px rgba(0,0,0,.08);
  border:3px solid #ffe2ad; margin-bottom:18px;
}
.progressbar { height:18px; background:#e9eef7; border-radius:99px; overflow:hidden; border:2px solid #d0d8e8; }
#bar { height:100%; width:0%; background:linear-gradient(90deg,#4f8cff,#8bd450); transition:.3s; }
.meta { display:flex; gap:12px; flex-wrap:wrap; justify-content:space-between; align-items:center; font-weight:800; margin-bottom:12px; }
.question { font-size:1.35rem; font-weight:900; margin:8px 0 18px; }
.options { display:grid; gap:12px; }
button.option {
  text-align:left; border:3px solid #d7e2f5; background:#f8fbff; border-radius:18px; padding:15px 16px;
  font-size:1rem; font-weight:800; cursor:pointer; transition:transform .08s, background .2s, border .2s;
}
button.option:hover { transform:translateY(-2px); border-color:var(--blue); }
button.option.correct { background:#dcf7e8; border-color:var(--good); }
button.option.wrong { background:#ffe2e2; border-color:var(--bad); }
button.option:disabled { cursor:default; }
.feedback { margin-top:16px; padding:14px; border-radius:16px; font-weight:800; display:none; }
.feedback.show { display:block; }
.good { background:#dcf7e8; color:#145c35; }
.bad { background:#ffe2e2; color:#8d2525; }
.controls { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-top:18px; }
.controls button, .start {
  border:0; border-radius:999px; padding:14px 22px; font-size:1rem; font-weight:900; cursor:pointer;
  background:var(--accent); color:#fff; box-shadow:0 5px 0 #c86721;
}
.controls button.secondary { background:#4f8cff; box-shadow:0 5px 0 #2d5fae; }
.hidden { display:none; }
.result { text-align:center; }
.result .score { font-size:3rem; font-weight:1000; color:#ff7a1a; }
.small { color:#596777; font-weight:700; }
.emoji { font-size:2.2rem; }
</style>
</head>
<body>
<header>
  <div class="emoji">🍁🧠✨</div>
  <h1>Modern Canada Quiz</h1>
  <div class="subtitle">30 PDF-validated, kid-friendly multiple-choice questions</div>
</header>
<main class="wrap">
  <section id="intro" class="panel result">
    <h2>Ready to play?</h2>
    <p class="small">Choose an answer, get instant feedback, and see your score at the end.</p>
    <button class="start" onclick="startQuiz()">Start Quiz</button>
  </section>

  <section id="quiz" class="hidden">
    <div class="panel">
      <div class="meta">
        <span id="count">Question 1 of 30</span>
        <span id="score">Score: 0</span>
      </div>
      <div class="progressbar"><div id="bar"></div></div>
    </div>
    <div class="question-card">
      <div class="question" id="question"></div>
      <div class="options" id="options"></div>
      <div id="feedback" class="feedback"></div>
      <div class="controls">
        <button class="secondary" onclick="previousQuestion()" id="prevBtn">⬅ Previous</button>
        <button class="secondary" onclick="nextQuestion()" id="nextBtn" disabled>Next ➜</button>
      </div>
    </div>
  </section>

  <section id="end" class="panel result hidden">
    <div class="emoji">🎉</div>
    <h2>Quiz Complete!</h2>
    <div class="score" id="finalScore"></div>
    <p id="message" class="small"></p>
    <button class="start" onclick="restartQuiz()">Play Again</button>
  </section>
</main>

<script>
const questions = [{"q": "How did World War I begin?", "options": ["Germany invaded Poland", "Archduke Franz Ferdinand was murdered by a Serbian", "Japan bombed Pearl Harbour", "Canada declared war on Italy"], "answer": 1}, {"q": "Which country did Austria side with at the beginning of World War I?", "options": ["Germany", "Russia", "Serbia", "Canada"], "answer": 0}, {"q": "Which country did Serbia side with at the beginning of World War I?", "options": ["Italy", "Japan", "Russia", "Germany"], "answer": 2}, {"q": "Why did Britain declare war after Germany invaded Belgium?", "options": ["Britain wanted to conquer Canada", "Britain had promised to defend Belgium’s neutrality", "Britain wanted to join Germany", "Britain was attacked by Japan"], "answer": 1}, {"q": "Why did Canada join World War I?", "options": ["Canada joined as part of the Allied forces supporting Britain", "Canada was invaded by Germany", "Canada wanted to attack Serbia", "Canada was ordered by Japan"], "answer": 0}, {"q": "How many soldiers did Canada have when it was not yet ready for war?", "options": ["30,000", "625,000", "3,000", "7,000"], "answer": 2}, {"q": "How many volunteers were trained within two months?", "options": ["3,000", "30,000", "625,000", "100"], "answer": 1}, {"q": "Between 1914 and 1918, how many Canadian men and women were sent to fight the war?", "options": ["625,000", "8 million", "60", "155,000"], "answer": 0}, {"q": "Which battle was described as one of the worst battles fought by Canadians and their allies?", "options": ["Battle of Dieppe", "Battle of Ypres", "Battle of Normandy", "Battle of Hong Kong"], "answer": 1}, {"q": "What deadly weapon had the Germans begun to use at the Battle of Ypres?", "options": ["Atomic bombs", "Poison gas", "Tanks only", "Rockets"], "answer": 1}, {"q": "What did Canadians do when French troops retreated at Ypres?", "options": ["They held the French line until Allied reinforcements came", "They surrendered immediately", "They left Europe", "They joined Germany"], "answer": 0}, {"q": "What happened at Vimy Ridge on April 9, 1917?", "options": ["Canada lost control of the ridge", "Four divisions of the Canadian Corps captured it from the Germans", "Japan attacked Canada", "Germany surrendered"], "answer": 1}, {"q": "What is conscription?", "options": ["Forcing men to join the army", "Sending money to farmers", "A peace treaty", "A type of radio show"], "answer": 0}, {"q": "Why did farmers oppose conscription?", "options": ["They did not want their sons taken away from working on farms", "They wanted Germany to win", "They wanted to leave Canada", "They were against radios"], "answer": 0}, {"q": "Why were Quakers and Mennonites against conscription?", "options": ["They believed war was evil", "They wanted more taxes", "They were not Canadian", "They wanted to join the navy"], "answer": 0}, {"q": "When did World War I end?", "options": ["September 1, 1939", "November 11, 1918", "June 6, 1944", "August 10, 1945"], "answer": 1}, {"q": "What peacekeeping force did Canada join after World War I?", "options": ["League of Nations", "Rome-Berlin Axis", "Nazi Reich", "CBC"], "answer": 0}, {"q": "Who wrote “In Flanders Fields”?", "options": ["Robert Borden", "Winston Churchill", "John McCrae", "Benito Mussolini"], "answer": 2}, {"q": "What did historians call the 1920s?", "options": ["The Quiet Years", "The Roaring Twenties", "The War Years", "The Dusty Decade"], "answer": 1}, {"q": "What was the Great Depression?", "options": ["A severe economic decline", "A military battle", "A new airplane company", "A poem"], "answer": 0}, {"q": "What event helped cause the Great Depression?", "options": ["The New York Stock Market Crash in October 1929", "The bombing of Pearl Harbour", "D-Day", "The Battle of Ypres"], "answer": 0}, {"q": "What percent of the population did not have jobs by 1933?", "options": ["10%", "30%", "75%", "90%"], "answer": 1}, {"q": "What did Alberta and Saskatchewan suffer from at the same time as the Great Depression?", "options": ["A severe drought", "A flood", "An invasion", "A gold rush"], "answer": 0}, {"q": "What became a favourite pastime of many housewives during the Depression?", "options": ["Window shopping", "Flying airplanes", "Joining the army", "Building ships"], "answer": 0}, {"q": "What form of entertainment became very popular during the Depression?", "options": ["Radio shows", "Video games", "Internet videos", "Smartphones"], "answer": 0}, {"q": "What two famous Canadian companies were started during the Great Depression?", "options": ["CBC and Trans-Canada Airline / Air Canada", "Hudson’s Bay and Canadian Tire", "CN Tower and VIA Rail", "NATO and League of Nations"], "answer": 0}, {"q": "Who was the leader of Italy before World War II?", "options": ["Benito Mussolini", "Adolf Hitler", "Joseph Stalin", "Winston Churchill"], "answer": 0}, {"q": "Who became dictator of Germany?", "options": ["Benito Mussolini", "Adolf Hitler", "Theodore Roosevelt", "Robert Borden"], "answer": 1}, {"q": "What was the purpose of the Treaty of Versailles, according to the PDF?", "options": ["To prevent Germany from ever starting another war", "To help Germany invade Poland", "To create Canada", "To start the CBC"], "answer": 0}, {"q": "What two Japanese cities were attacked with atomic bombs by the USA?", "options": ["Tokyo and Kyoto", "Hiroshima and Nagasaki", "Osaka and Kobe", "Sapporo and Yokohama"], "answer": 1}];
let current = 0;
let score = 0;
let answered = false;

function startQuiz(){
  document.getElementById('intro').classList.add('hidden');
  document.getElementById('quiz').classList.remove('hidden');
  showQuestion();
}
function showQuestion(){
  answered = false;
  const item = questions[current];
  document.getElementById('count').textContent = `Question ${current+1} of ${questions.length}`;
  document.getElementById('score').textContent = `Score: ${score}`;
  document.getElementById('bar').style.width = `${(current/questions.length)*100}%`;
  document.getElementById('question').textContent = item.q;
  const box = document.getElementById('options');
  box.innerHTML = '';
  document.getElementById('feedback').className = 'feedback';
  document.getElementById('feedback').textContent = '';
  document.getElementById('nextBtn').disabled = true;
  document.getElementById('prevBtn').disabled = current === 0;
  const shuffledOptions = item.options
    .map((opt, idx) => ({ text: opt, originalIndex: idx }))
    .sort(() => Math.random() - 0.5);

  shuffledOptions.forEach((opt, displayIndex) => {
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.dataset.originalIndex = opt.originalIndex;
    btn.textContent = `${String.fromCharCode(65+displayIndex)}. ${opt.text}`;
    btn.onclick = () => chooseAnswer(opt.originalIndex, btn);
    box.appendChild(btn);
  });
}
function chooseAnswer(idx, btn){
  if(answered) return;
  answered = true;
  const item = questions[current];
  const buttons = document.querySelectorAll('.option');
  buttons.forEach((b) => {
    b.disabled = true;
    if(Number(b.dataset.originalIndex) === item.answer) b.classList.add('correct');
  });
  const feedback = document.getElementById('feedback');
  if(idx === item.answer){
    score++;
    btn.classList.add('correct');
    feedback.textContent = 'Great job! That is correct. 🌟';
    feedback.className = 'feedback show good';
  } else {
    btn.classList.add('wrong');
    const correctButton = Array.from(buttons).find(b => Number(b.dataset.originalIndex) === item.answer);
    const correctLetter = correctButton ? correctButton.textContent.split('.')[0] : '';
    feedback.textContent = `Good try! The correct answer is ${correctLetter}. ${item.options[item.answer]}`;
    feedback.className = 'feedback show bad';
  }
  document.getElementById('score').textContent = `Score: ${score}`;
  document.getElementById('nextBtn').disabled = false;
}

function nextQuestion(){
  current++;
  if(current >= questions.length){
    finishQuiz();
  } else {
    showQuestion();
  }
}

function previousQuestion(){
  if(current === 0) return;
  current--;
  showQuestion();
}
function finishQuiz(){
  document.getElementById('quiz').classList.add('hidden');
  document.getElementById('end').classList.remove('hidden');
  document.getElementById('bar').style.width = '100%';
  document.getElementById('finalScore').textContent = `${score} / ${questions.length}`;
  let msg = score >= 26 ? 'Amazing! You are a Modern Canada master!' :
            score >= 20 ? 'Nice work! A little review and you will crush it!' :
            score >= 15 ? 'Good effort! Try again to boost your score.' :
            'Keep practicing — every try makes you stronger!';
  document.getElementById('message').textContent = msg;
}
function restartQuiz(){
  current = 0; score = 0;
  document.getElementById('end').classList.add('hidden');
  document.getElementById('quiz').classList.remove('hidden');
  showQuestion();
}
</script>
</body>
</html>
