<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz</title>
<style>
:root {
  --bg:#fff7df; --card:#ffffff; --ink:#203040; --accent:#ff8f3d; --good:#2fa866; --bad:#e05252; --blue:#4f8cff;
}
* { box-sizing:border-box; }
body {
  margin:0; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: radial-gradient(circle at top left,#dff4ff,transparent 30%), var(--bg);
  color:var(--ink);
}
header {
  padding:28px 18px; text-align:center; background:linear-gradient(135deg,#ffcf6e,#ff8f3d);
  border-bottom:6px solid #ffdca3;
}
.home-link {
  display:inline-block; margin-bottom:14px; padding:8px 14px; border-radius:999px;
  background:rgba(255,255,255,.82); border:2px solid #fff1c8; color:var(--ink);
  font-weight:900; text-decoration:none; box-shadow:0 3px 0 rgba(0,0,0,.08);
}
.home-link:hover, .home-link:focus { border-color:var(--blue); outline:none; }
h1 { margin:0; font-size:clamp(2rem,5vw,3.5rem); }
.subtitle { font-size:1.1rem; margin-top:8px; font-weight:700; }
.wrap { max-width:920px; margin:24px auto; padding:0 16px 40px; }
.panel, .question-card {
  background:var(--card); border-radius:24px; padding:22px; box-shadow:0 8px 0 rgba(0,0,0,.08), 0 14px 30px rgba(0,0,0,.08);
  border:3px solid #ffe2ad; margin-bottom:18px;
}
.progressbar { height:18px; background:#e9eef7; border-radius:99px; overflow:hidden; border:2px solid #d0d8e8; }
#bar { height:100%; width:0%; background:linear-gradient(90deg,#4f8cff,#8bd450); transition:.3s; }
.meta { display:flex; gap:12px; flex-wrap:wrap; justify-content:space-between; align-items:center; font-weight:800; margin-bottom:12px; }
.question { font-size:1.35rem; font-weight:900; margin:8px 0 18px; }
.options { display:grid; gap:12px; }
button.option {
  text-align:left; border:3px solid #d7e2f5; background:#f8fbff; border-radius:18px; padding:15px 16px;
  font-size:1rem; font-weight:800; cursor:pointer; transition:transform .08s, background .2s, border .2s;
}
button.option:hover { transform:translateY(-2px); border-color:var(--blue); }
button.option.correct { background:#dcf7e8; border-color:var(--good); }
button.option.wrong { background:#ffe2e2; border-color:var(--bad); }
button.option:disabled { cursor:default; }
.feedback { margin-top:16px; padding:14px; border-radius:16px; font-weight:800; display:none; }
.feedback.show { display:block; }
.good { background:#dcf7e8; color:#145c35; }
.bad { background:#ffe2e2; color:#8d2525; }
.controls { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-top:18px; }
.controls button, .start {
  border:0; border-radius:999px; padding:14px 22px; font-size:1rem; font-weight:900; cursor:pointer;
  background:var(--accent); color:#fff; box-shadow:0 5px 0 #c86721;
}
.controls button.secondary { background:#4f8cff; box-shadow:0 5px 0 #2d5fae; }
.controls button:disabled, .start:disabled {
  cursor:not-allowed; filter:grayscale(.3); opacity:.65;
}
.hidden { display:none; }
.result { text-align:center; }
.result .score { font-size:3rem; font-weight:1000; color:#ff7a1a; }
.small { color:#596777; font-weight:700; }
.emoji { font-size:2.2rem; }
.error { background:#ffe2e2; color:#8d2525; }
</style>
</head>
<body data-quiz-file="modern_canada_quiz.json">
<header>
  <a class="home-link" id="homeLink" href="index.html">Back to home</a>
  <div class="emoji" id="emoji">🍁🧠✨</div>
  <h1 id="title">Loading Quiz...</h1>
  <div class="subtitle" id="subtitle">Getting questions ready.</div>
</header>
<main class="wrap">
  <section id="intro" class="panel result">
    <h2 id="introTitle">Ready to play?</h2>
    <p class="small" id="introText">Choose an answer, get instant feedback, and see your score at the end.</p>
    <button class="start" id="startBtn" onclick="startQuiz()" disabled>Start Quiz</button>
  </section>

  <section id="quiz" class="hidden">
    <div class="panel">
      <div class="meta">
        <span id="count">Question 1 of 0</span>
        <span id="score">Score: 0</span>
      </div>
      <div class="progressbar"><div id="bar"></div></div>
    </div>
    <div class="question-card">
      <div class="question" id="question"></div>
      <div class="options" id="options"></div>
      <div id="feedback" class="feedback"></div>
      <div class="controls">
        <button class="secondary" onclick="previousQuestion()" id="prevBtn">⬅ Previous</button>
        <button class="secondary" onclick="nextQuestion()" id="nextBtn" disabled>Next ➜</button>
      </div>
    </div>
  </section>

  <section id="end" class="panel result hidden">
    <div class="emoji">🎉</div>
    <h2>Quiz Complete!</h2>
    <div class="score" id="finalScore"></div>
    <p id="message" class="small"></p>
    <button class="start" onclick="restartQuiz()">Play Again</button>
  </section>
</main>

<script>
let questions = [];
let current = 0;
let score = 0;
let answered = false;

const params = new URLSearchParams(window.location.search);
const quizFile = params.get('quiz') || document.body.dataset.quizFile || 'modern_canada_quiz.json';
const homeLink = document.getElementById('homeLink');
if(homeLink && window.location.pathname.includes('/grade4/')){
  homeLink.href = '../pages/index.html';
}

loadQuiz(quizFile);

async function loadQuiz(fileName){
  try {
    const response = await fetch(fileName);
    if(!response.ok) throw new Error(`Could not load ${fileName}`);
    const quiz = await response.json();
    validateQuiz(quiz);
    questions = quiz.questions;
    document.title = quiz.title;
    document.getElementById('title').textContent = quiz.title;
    document.getElementById('subtitle').textContent = quiz.subtitle;
    document.getElementById('emoji').textContent = quiz.emoji || '🧠';
    document.getElementById('introTitle').textContent = quiz.introTitle || 'Ready to play?';
    document.getElementById('introText').textContent = quiz.introText || 'Choose an answer, get instant feedback, and see your score at the end.';
    document.getElementById('startBtn').disabled = false;
  } catch (error) {
    showLoadError(error);
  }
}

function validateQuiz(quiz){
  if(!quiz || typeof quiz.title !== 'string' || typeof quiz.subtitle !== 'string' || !Array.isArray(quiz.questions)){
    throw new Error('Quiz JSON must include title, subtitle, and questions.');
  }
  quiz.questions.forEach((item, index) => {
    if(typeof item.question !== 'string' || !Array.isArray(item.options) || !Number.isInteger(item.answer)){
      throw new Error(`Question ${index + 1} is missing question, options, or answer.`);
    }
    if(item.answer < 0 || item.answer >= item.options.length){
      throw new Error(`Question ${index + 1} has an answer outside its options.`);
    }
  });
}

function showLoadError(error){
  document.getElementById('title').textContent = 'Quiz could not load';
  document.getElementById('subtitle').textContent = 'Start a local web server and open this page again.';
  document.getElementById('introTitle').textContent = 'Question file not available';
  document.getElementById('introText').textContent = error.message;
  document.getElementById('intro').classList.add('error');
}

function startQuiz(){
  if(questions.length === 0) return;
  document.getElementById('intro').classList.add('hidden');
  document.getElementById('quiz').classList.remove('hidden');
  showQuestion();
}
function showQuestion(){
  answered = false;
  const item = questions[current];
  document.getElementById('count').textContent = `Question ${current+1} of ${questions.length}`;
  document.getElementById('score').textContent = `Score: ${score}`;
  document.getElementById('bar').style.width = `${(current/questions.length)*100}%`;
  document.getElementById('question').textContent = item.question;
  const box = document.getElementById('options');
  box.innerHTML = '';
  document.getElementById('feedback').className = 'feedback';
  document.getElementById('feedback').textContent = '';
  document.getElementById('nextBtn').disabled = true;
  document.getElementById('prevBtn').disabled = current === 0;
  const shuffledOptions = item.options
    .map((opt, idx) => ({ text: opt, originalIndex: idx }))
    .sort(() => Math.random() - 0.5);

  shuffledOptions.forEach((opt, displayIndex) => {
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.dataset.originalIndex = opt.originalIndex;
    btn.textContent = `${String.fromCharCode(65+displayIndex)}. ${opt.text}`;
    btn.onclick = () => chooseAnswer(opt.originalIndex, btn);
    box.appendChild(btn);
  });
}
function chooseAnswer(idx, btn){
  if(answered) return;
  answered = true;
  const item = questions[current];
  const buttons = document.querySelectorAll('.option');
  buttons.forEach((b) => {
    b.disabled = true;
    if(Number(b.dataset.originalIndex) === item.answer) b.classList.add('correct');
  });
  const feedback = document.getElementById('feedback');
  if(idx === item.answer){
    score++;
    btn.classList.add('correct');
    feedback.textContent = 'Great job! That is correct. 🌟';
    feedback.className = 'feedback show good';
  } else {
    btn.classList.add('wrong');
    const correctButton = Array.from(buttons).find(b => Number(b.dataset.originalIndex) === item.answer);
    const correctLetter = correctButton ? correctButton.textContent.split('.')[0] : '';
    feedback.textContent = `Good try! The correct answer is ${correctLetter}. ${item.options[item.answer]}`;
    feedback.className = 'feedback show bad';
  }
  document.getElementById('score').textContent = `Score: ${score}`;
  document.getElementById('nextBtn').disabled = false;
}

function nextQuestion(){
  current++;
  if(current >= questions.length){
    finishQuiz();
  } else {
    showQuestion();
  }
}

function previousQuestion(){
  if(current === 0) return;
  current--;
  showQuestion();
}
function finishQuiz(){
  document.getElementById('quiz').classList.add('hidden');
  document.getElementById('end').classList.remove('hidden');
  document.getElementById('bar').style.width = '100%';
  document.getElementById('finalScore').textContent = `${score} / ${questions.length}`;
  let msg = score >= Math.ceil(questions.length * .86) ? 'Amazing! You are a quiz master!' :
            score >= Math.ceil(questions.length * .66) ? 'Nice work! A little review and you will crush it!' :
            score >= Math.ceil(questions.length * .5) ? 'Good effort! Try again to boost your score.' :
            'Keep practicing — every try makes you stronger!';
  document.getElementById('message').textContent = msg;
}
function restartQuiz(){
  current = 0; score = 0;
  document.getElementById('end').classList.add('hidden');
  document.getElementById('quiz').classList.remove('hidden');
  showQuestion();
}
</script>
</body>
</html>
