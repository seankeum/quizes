<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz</title>
<style>
:root {
  --bg:#f8f9fa;
  --card:#ffffff;
  --ink:#212529;
  --muted:#6c757d;
  --line:#dee2e6;
  --soft-blue:#cff4fc;
  --soft-green:#d1e7dd;
  --soft-red:#f8d7da;
  --good:#198754;
  --bad:#dc3545;
  --blue:#0d6efd;
}
* { box-sizing:border-box; }
body {
  margin:0; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background:var(--bg);
  color:var(--ink);
}
header {
  padding:24px 18px; background:var(--card);
  border-bottom:1px solid var(--line);
}
.home-link {
  display:inline-flex; align-items:center; margin-bottom:14px; padding:7px 11px; border-radius:6px;
  background:#fff; border:1px solid var(--blue); color:var(--blue);
  font-weight:700; text-decoration:none;
}
.home-link:hover, .home-link:focus { background:#e7f1ff; outline:none; }
h1 { margin:0; font-size:clamp(2rem,5vw,3rem); line-height:1.1; }
.subtitle { color:var(--muted); font-size:1.05rem; margin-top:8px; font-weight:500; }
.wrap, header > * { max-width:920px; margin-left:auto; margin-right:auto; }
.wrap { margin-top:28px; padding:0 16px 40px; }
.panel, .question-card {
  background:var(--card); border-radius:8px; padding:22px; box-shadow:0 .125rem .25rem rgba(0,0,0,.075);
  border:1px solid var(--line); margin-bottom:18px;
}
.progressbar { height:12px; background:#e9ecef; border-radius:999px; overflow:hidden; }
#bar { height:100%; width:0%; background:var(--blue); transition:.3s; }
.meta { display:flex; gap:12px; flex-wrap:wrap; justify-content:space-between; align-items:center; color:#055160; background:var(--soft-blue); border:1px solid #b6effb; border-radius:6px; padding:10px 12px; font-weight:700; margin-bottom:14px; }
.question { font-size:1.35rem; font-weight:700; line-height:1.3; margin:8px 0 18px; }
.options { display:grid; gap:12px; }
button.option {
  text-align:left; border:1px solid var(--line); background:#fff; border-radius:6px; padding:13px 14px;
  color:var(--ink); font-size:1rem; font-weight:600; line-height:1.35; cursor:pointer; transition:background .15s, border .15s, box-shadow .15s;
}
button.option:hover, button.option:focus { border-color:var(--blue); box-shadow:0 0 0 .2rem rgba(13,110,253,.15); outline:none; }
button.option.correct { background:var(--soft-green); border-color:var(--good); color:#0f5132; }
button.option.wrong { background:var(--soft-red); border-color:var(--bad); color:#842029; }
button.option:disabled { cursor:default; }
.feedback { margin-top:16px; padding:14px; border-radius:6px; font-weight:700; display:none; border:1px solid transparent; }
.feedback.show { display:block; }
.good { background:var(--soft-green); color:#0f5132; border-color:#badbcc; }
.bad { background:var(--soft-red); color:#842029; border-color:#f5c2c7; }
.controls, .intro-actions, .pdf-actions { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-top:18px; }
.intro-actions { align-items:center; }
.pdf-actions { margin-top:0; }
.controls button, .start, .pdf-link {
  border:1px solid var(--blue); border-radius:6px; padding:10px 16px; font-size:1rem; font-weight:700; cursor:pointer;
  background:var(--blue); color:#fff;
}
.pdf-link {
  display:inline-flex; align-items:center; justify-content:center; text-decoration:none;
}
.pdf-link.combined { background:#fff; color:var(--blue); }
.controls button:hover, .controls button:focus, .start:hover, .start:focus, .pdf-link:hover, .pdf-link:focus { background:#0b5ed7; border-color:#0a58ca; color:#fff; outline:none; }
.controls button.secondary { background:#fff; color:var(--blue); }
.controls button.secondary:hover, .controls button.secondary:focus { background:#e7f1ff; color:#0a58ca; }
.controls button:disabled, .start:disabled {
  cursor:not-allowed; opacity:.65;
}
.hidden { display:none; }
.result { text-align:center; }
.result .score { font-size:3rem; font-weight:800; color:var(--blue); }
.small { color:var(--muted); font-weight:500; line-height:1.5; }
.emoji { display:none; }
.error { background:var(--soft-red); color:#842029; border-color:#f5c2c7; }
@media (max-width:640px) {
  header { padding:20px 16px; }
  .wrap { margin-top:18px; }
  .panel, .question-card { padding:16px; }
  .question { font-size:1.15rem; }
}
</style>
</head>
<body data-quiz-file="modern_canada_quiz.json">
<header>
  <a class="home-link" id="homeLink" href="index.html">Back to home</a>
  <div class="emoji" id="emoji">🍁🧠✨</div>
  <h1 id="title">Loading Quiz...</h1>
  <div class="subtitle" id="subtitle">Getting questions ready.</div>
</header>
<main class="wrap">
  <section id="intro" class="panel result">
    <h2 id="introTitle">Ready to play?</h2>
    <p class="small" id="introText">Choose an answer, get instant feedback, and see your score at the end.</p>
    <div class="intro-actions">
      <button class="start" id="startBtn" onclick="startQuiz()" disabled>Start Quiz</button>
      <div class="pdf-actions hidden" id="pdfActions" aria-label="Printable quiz exports">
        <a class="pdf-link combined" id="combinedPdfLink" href="print-quiz.html?quiz=modern_canada_quiz.json&answers=1">Print Quiz PDF</a>
      </div>
    </div>
  </section>

  <section id="quiz" class="hidden">
    <div class="panel">
      <div class="meta">
        <span id="count">Question 1 of 0</span>
        <span id="score">Score: 0</span>
      </div>
      <div class="progressbar"><div id="bar"></div></div>
    </div>
    <div class="question-card">
      <div class="question" id="question"></div>
      <div class="options" id="options"></div>
      <div id="feedback" class="feedback"></div>
      <div class="controls">
        <button class="secondary" onclick="previousQuestion()" id="prevBtn">Previous</button>
        <button class="secondary" onclick="nextQuestion()" id="nextBtn" disabled>Next question</button>
      </div>
    </div>
  </section>

  <section id="end" class="panel result hidden">
    <div class="emoji">🎉</div>
    <h2>Quiz Complete!</h2>
    <div class="score" id="finalScore"></div>
    <p id="message" class="small"></p>
    <button class="start" onclick="restartQuiz()">Play Again</button>
  </section>
</main>

<script>
let questions = [];
let current = 0;
let score = 0;
let answered = false;

const params = new URLSearchParams(window.location.search);
const quizFile = params.get('quiz') || document.body.dataset.quizFile || 'modern_canada_quiz.json';
const homeLink = document.getElementById('homeLink');
if(homeLink && window.location.pathname.includes('/grade4/')){
  homeLink.href = '../pages/index.html';
}

loadQuiz(quizFile);

async function loadQuiz(fileName){
  try {
    const response = await fetch(fileName);
    if(!response.ok) throw new Error(`Could not load ${fileName}`);
    const quiz = await response.json();
    validateQuiz(quiz);
    questions = quiz.questions;
    document.title = quiz.title;
    document.getElementById('title').textContent = quiz.title;
    document.getElementById('subtitle').textContent = quiz.subtitle;
    document.getElementById('emoji').textContent = quiz.emoji || '🧠';
    document.getElementById('introTitle').textContent = quiz.introTitle || 'Ready to play?';
    document.getElementById('introText').textContent = quiz.introText || 'Choose an answer, get instant feedback, and see your score at the end.';
    document.getElementById('startBtn').disabled = false;
    setPdfLinks(fileName);
  } catch (error) {
    showLoadError(error);
  }
}

function setPdfLinks(fileName){
  const encodedQuizFile = encodeURIComponent(fileName);
  const combinedUrl = `print-quiz.html?quiz=${encodedQuizFile}&answers=1`;
  document.getElementById('combinedPdfLink').href = combinedUrl;
  document.getElementById('pdfActions').classList.remove('hidden');
}

function validateQuiz(quiz){
  if(!quiz || typeof quiz.title !== 'string' || typeof quiz.subtitle !== 'string' || !Array.isArray(quiz.questions)){
    throw new Error('Quiz JSON must include title, subtitle, and questions.');
  }
  quiz.questions.forEach((item, index) => {
    if(typeof item.question !== 'string' || !Array.isArray(item.options) || !Number.isInteger(item.answer)){
      throw new Error(`Question ${index + 1} is missing question, options, or answer.`);
    }
    if(item.answer < 0 || item.answer >= item.options.length){
      throw new Error(`Question ${index + 1} has an answer outside its options.`);
    }
  });
}

function showLoadError(error){
  document.getElementById('title').textContent = 'Quiz could not load';
  document.getElementById('subtitle').textContent = 'Start a local web server and open this page again.';
  document.getElementById('introTitle').textContent = 'Question file not available';
  document.getElementById('introText').textContent = error.message;
  document.getElementById('intro').classList.add('error');
}

function startQuiz(){
  if(questions.length === 0) return;
  document.getElementById('intro').classList.add('hidden');
  document.getElementById('quiz').classList.remove('hidden');
  showQuestion();
}
function showQuestion(){
  answered = false;
  const item = questions[current];
  document.getElementById('count').textContent = `Question ${current+1} of ${questions.length}`;
  document.getElementById('score').textContent = `Score: ${score}`;
  document.getElementById('bar').style.width = `${(current/questions.length)*100}%`;
  document.getElementById('question').textContent = item.question;
  const box = document.getElementById('options');
  box.innerHTML = '';
  document.getElementById('feedback').className = 'feedback';
  document.getElementById('feedback').textContent = '';
  document.getElementById('nextBtn').disabled = true;
  document.getElementById('prevBtn').disabled = current === 0;
  const shuffledOptions = item.options
    .map((opt, idx) => ({ text: opt, originalIndex: idx }))
    .sort(() => Math.random() - 0.5);

  shuffledOptions.forEach((opt, displayIndex) => {
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.dataset.originalIndex = opt.originalIndex;
    btn.textContent = `${String.fromCharCode(65+displayIndex)}. ${opt.text}`;
    btn.onclick = () => chooseAnswer(opt.originalIndex, btn);
    box.appendChild(btn);
  });
}
function chooseAnswer(idx, btn){
  if(answered) return;
  answered = true;
  const item = questions[current];
  const buttons = document.querySelectorAll('.option');
  buttons.forEach((b) => {
    b.disabled = true;
    if(Number(b.dataset.originalIndex) === item.answer) b.classList.add('correct');
  });
  const feedback = document.getElementById('feedback');
  if(idx === item.answer){
    score++;
    btn.classList.add('correct');
    feedback.textContent = 'Correct. Nice work.';
    feedback.className = 'feedback show good';
  } else {
    btn.classList.add('wrong');
    const correctButton = Array.from(buttons).find(b => Number(b.dataset.originalIndex) === item.answer);
    const correctLetter = correctButton ? correctButton.textContent.split('.')[0] : '';
    feedback.textContent = `Good try! The correct answer is ${correctLetter}. ${item.options[item.answer]}`;
    feedback.className = 'feedback show bad';
  }
  document.getElementById('score').textContent = `Score: ${score}`;
  document.getElementById('nextBtn').disabled = false;
}

function nextQuestion(){
  current++;
  if(current >= questions.length){
    finishQuiz();
  } else {
    showQuestion();
  }
}

function previousQuestion(){
  if(current === 0) return;
  current--;
  showQuestion();
}
function finishQuiz(){
  document.getElementById('quiz').classList.add('hidden');
  document.getElementById('end').classList.remove('hidden');
  document.getElementById('bar').style.width = '100%';
  document.getElementById('finalScore').textContent = `${score} / ${questions.length}`;
  let msg = score >= Math.ceil(questions.length * .86) ? 'Amazing! You are a quiz master!' :
            score >= Math.ceil(questions.length * .66) ? 'Nice work! A little review and you will crush it!' :
            score >= Math.ceil(questions.length * .5) ? 'Good effort! Try again to boost your score.' :
            'Keep practicing — every try makes you stronger!';
  document.getElementById('message').textContent = msg;
}
function restartQuiz(){
  current = 0; score = 0;
  document.getElementById('end').classList.add('hidden');
  document.getElementById('quiz').classList.remove('hidden');
  showQuestion();
}
</script>
</body>
</html>
