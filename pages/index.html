<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quizes</title>
<style>
:root {
  --bg: #f8f9fa;
  --card: #ffffff;
  --ink: #212529;
  --muted: #6c757d;
  --line: #dee2e6;
  --soft-blue: #e7f1ff;
  --blue: #0d6efd;
  --green: #198754;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: var(--bg);
  color: var(--ink);
}
header {
  padding: 28px 18px 24px;
  background: var(--card);
  border-bottom: 1px solid var(--line);
}
h1 {
  margin: 0;
  max-width: 900px;
  margin-inline: auto;
  font-size: clamp(2rem, 5vw, 3rem);
  line-height: 1.1;
}
.subtitle {
  max-width: 900px;
  margin-inline: auto;
  margin-top: 8px;
  font-size: 1.1rem;
  color: var(--muted);
  font-weight: 500;
}
main {
  max-width: 900px;
  margin: 28px auto;
  padding: 0 16px 40px;
}
.quiz-section {
  margin-bottom: 28px;
}
h2 {
  margin: 0 0 12px;
  font-size: 1.25rem;
  line-height: 1.25;
}
.quiz-list {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  grid-auto-rows: 1fr;
  gap: 16px;
  margin: 0;
  padding: 0;
  list-style: none;
}
.quiz-list > li {
  display: flex;
}
.quiz-link {
  display: flex;
  width: 100%;
  height: 100%;
  min-height: 160px;
  flex-direction: column;
  justify-content: space-between;
  padding: 18px;
  color: inherit;
  text-decoration: none;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 8px;
  box-shadow: 0 .125rem .25rem rgba(0, 0, 0, .075);
  transition: border-color .15s, box-shadow .15s, transform .08s;
}
.quiz-link:hover,
.quiz-link:focus {
  border-color: var(--blue);
  box-shadow: 0 .5rem 1rem rgba(0, 0, 0, .12);
  transform: translateY(-1px);
  outline: none;
}
.quiz-title {
  display: block;
  margin-bottom: 8px;
  font-size: 1.25rem;
  font-weight: 700;
  line-height: 1.25;
}
.quiz-meta {
  color: var(--muted);
  font-size: .98rem;
  font-weight: 500;
  line-height: 1.4;
}
.start-label {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: fit-content;
  margin-top: 18px;
  padding: 8px 12px;
  color: #fff;
  background: var(--blue);
  border-radius: 6px;
  font-size: .95rem;
  font-weight: 700;
}
.notice {
  padding: 20px;
  color: var(--muted);
  font-weight: 600;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 8px;
}
</style>
</head>
<body>
<header>
  <h1>Available Quizzes</h1>
  <div class="subtitle">Choose a quiz to start.</div>
</header>
<main id="quizSections">
  <section class="quiz-section">
    <p class="notice">Loading quizzes...</p>
  </section>
</main>
<script>
loadQuizIndex();

async function loadQuizIndex() {
  const container = document.getElementById('quizSections');

  try {
    const response = await fetch("quizzes.json");
    if (!response.ok) throw new Error('Could not load quizzes.json');
    const data = await response.json();
    validateQuizIndex(data);
    renderQuizIndex(data.sections, container);
  } catch (error) {
    container.innerHTML = '';
    const notice = document.createElement('p');
    notice.className = 'notice';
    notice.textContent = error.message;
    container.appendChild(notice);
  }
}

function validateQuizIndex(data) {
  if (!data || !Array.isArray(data.sections)) {
    throw new Error('Quiz index must include sections.');
  }
}

function renderQuizIndex(sections, container) {
  container.innerHTML = '';

  sections.forEach((section, sectionIndex) => {
    const headingId = `quiz-section-${sectionIndex + 1}`;
    const sectionEl = document.createElement('section');
    sectionEl.className = 'quiz-section';
    sectionEl.setAttribute('aria-labelledby', headingId);

    const heading = document.createElement('h2');
    heading.id = headingId;
    heading.textContent = section.heading;
    sectionEl.appendChild(heading);

    const list = document.createElement('ul');
    list.className = 'quiz-list';

    section.quizzes.forEach((quiz) => {
      const item = document.createElement('li');
      const link = document.createElement('a');
      link.className = 'quiz-link';
      link.href = quiz.href;

      const title = document.createElement('span');
      title.className = 'quiz-title';
      title.textContent = quiz.title;

      const meta = document.createElement('span');
      meta.className = 'quiz-meta';
      meta.textContent = quiz.meta;

      const start = document.createElement('span');
      start.className = 'start-label';
      start.textContent = 'Start quiz';

      link.append(title, meta, start);
      item.appendChild(link);
      list.appendChild(item);
    });

    sectionEl.appendChild(list);
    container.appendChild(sectionEl);
  });
}
</script>
</body>
</html>
