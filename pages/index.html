<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quizes</title>
<style>
:root {
  --bg: #fff7df;
  --card: #ffffff;
  --ink: #203040;
  --muted: #596777;
  --accent: #ff8f3d;
  --blue: #4f8cff;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: radial-gradient(circle at top left, #dff4ff, transparent 30%), var(--bg);
  color: var(--ink);
}
header {
  padding: 32px 18px;
  text-align: center;
  background: linear-gradient(135deg, #ffcf6e, #ff8f3d);
  border-bottom: 6px solid #ffdca3;
}
h1 {
  margin: 0;
  font-size: clamp(2rem, 5vw, 3.25rem);
}
.subtitle {
  margin-top: 8px;
  font-size: 1.1rem;
  font-weight: 800;
}
main {
  max-width: 900px;
  margin: 24px auto;
  padding: 0 16px 40px;
}
.quiz-section {
  margin-bottom: 22px;
}
h2 {
  margin: 0 0 12px;
  font-size: 1.4rem;
}
.quiz-list {
  display: grid;
  gap: 14px;
  margin: 0;
  padding: 0;
  list-style: none;
}
.quiz-link {
  display: block;
  min-height: 118px;
  padding: 20px;
  color: inherit;
  text-decoration: none;
  background: var(--card);
  border: 3px solid #ffe2ad;
  border-radius: 20px;
  box-shadow: 0 8px 0 rgba(0, 0, 0, .08), 0 14px 30px rgba(0, 0, 0, .08);
  transition: border-color .2s, transform .08s;
}
.quiz-link:hover,
.quiz-link:focus {
  border-color: var(--blue);
  transform: translateY(-2px);
  outline: none;
}
.quiz-title {
  display: block;
  margin-bottom: 6px;
  font-size: 1.2rem;
  font-weight: 900;
}
.quiz-meta {
  color: var(--muted);
  font-weight: 750;
}
.start-label {
  display: inline-block;
  margin-top: 14px;
  color: var(--accent);
  font-weight: 950;
}
</style>
</head>
<body>
<header>
  <h1>Available Quizzes</h1>
  <div class="subtitle">Choose a quiz to start.</div>
</header>
<main>
  <section class="quiz-section" aria-labelledby="grade4-heading">
    <h2 id="grade4-heading">Grade 4</h2>
    <ul class="quiz-list">
      <li>
        <a class="quiz-link" href="grade4/modern_canada_quiz.html">
          <span class="quiz-title">Modern Canada Quiz</span>
          <span class="quiz-meta">30 kid-friendly multiple-choice questions</span>
          <span class="start-label">Start quiz</span>
        </a>
      </li>
    </ul>
  </section>
</main>
</body>
</html>
