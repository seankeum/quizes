<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quizes</title>
<style>
:root {
  --bg: #fff7df;
  --card: #ffffff;
  --ink: #203040;
  --muted: #596777;
  --accent: #ff8f3d;
  --blue: #4f8cff;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: radial-gradient(circle at top left, #dff4ff, transparent 30%), var(--bg);
  color: var(--ink);
}
header {
  padding: 32px 18px;
  text-align: center;
  background: linear-gradient(135deg, #ffcf6e, #ff8f3d);
  border-bottom: 6px solid #ffdca3;
}
h1 {
  margin: 0;
  font-size: clamp(2rem, 5vw, 3.25rem);
}
.subtitle {
  margin-top: 8px;
  font-size: 1.1rem;
  font-weight: 800;
}
main {
  max-width: 900px;
  margin: 24px auto;
  padding: 0 16px 40px;
}
.quiz-section {
  margin-bottom: 22px;
}
h2 {
  margin: 0 0 12px;
  font-size: 1.4rem;
}
.quiz-list {
  display: grid;
  gap: 14px;
  margin: 0;
  padding: 0;
  list-style: none;
}
.quiz-link {
  display: block;
  min-height: 118px;
  padding: 20px;
  color: inherit;
  text-decoration: none;
  background: var(--card);
  border: 3px solid #ffe2ad;
  border-radius: 20px;
  box-shadow: 0 8px 0 rgba(0, 0, 0, .08), 0 14px 30px rgba(0, 0, 0, .08);
  transition: border-color .2s, transform .08s;
}
.quiz-link:hover,
.quiz-link:focus {
  border-color: var(--blue);
  transform: translateY(-2px);
  outline: none;
}
.quiz-title {
  display: block;
  margin-bottom: 6px;
  font-size: 1.2rem;
  font-weight: 900;
}
.quiz-meta {
  color: var(--muted);
  font-weight: 750;
}
.start-label {
  display: inline-block;
  margin-top: 14px;
  color: var(--accent);
  font-weight: 950;
}
.notice {
  padding: 20px;
  color: var(--muted);
  font-weight: 800;
  background: var(--card);
  border: 3px solid #ffe2ad;
  border-radius: 20px;
}
</style>
</head>
<body>
<header>
  <h1>Available Quizzes</h1>
  <div class="subtitle">Choose a quiz to start.</div>
</header>
<main id="quizSections">
  <section class="quiz-section">
    <p class="notice">Loading quizzes...</p>
  </section>
</main>
<script>
loadQuizIndex();

async function loadQuizIndex() {
  const container = document.getElementById('quizSections');

  try {
    const response = await fetch("quizzes.json");
    if (!response.ok) throw new Error('Could not load quizzes.json');
    const data = await response.json();
    validateQuizIndex(data);
    renderQuizIndex(data.sections, container);
  } catch (error) {
    container.innerHTML = '';
    const notice = document.createElement('p');
    notice.className = 'notice';
    notice.textContent = error.message;
    container.appendChild(notice);
  }
}

function validateQuizIndex(data) {
  if (!data || !Array.isArray(data.sections)) {
    throw new Error('Quiz index must include sections.');
  }
}

function renderQuizIndex(sections, container) {
  container.innerHTML = '';

  sections.forEach((section, sectionIndex) => {
    const headingId = `quiz-section-${sectionIndex + 1}`;
    const sectionEl = document.createElement('section');
    sectionEl.className = 'quiz-section';
    sectionEl.setAttribute('aria-labelledby', headingId);

    const heading = document.createElement('h2');
    heading.id = headingId;
    heading.textContent = section.heading;
    sectionEl.appendChild(heading);

    const list = document.createElement('ul');
    list.className = 'quiz-list';

    section.quizzes.forEach((quiz) => {
      const item = document.createElement('li');
      const link = document.createElement('a');
      link.className = 'quiz-link';
      link.href = quiz.href;

      const title = document.createElement('span');
      title.className = 'quiz-title';
      title.textContent = quiz.title;

      const meta = document.createElement('span');
      meta.className = 'quiz-meta';
      meta.textContent = quiz.meta;

      const start = document.createElement('span');
      start.className = 'start-label';
      start.textContent = 'Start quiz';

      link.append(title, meta, start);
      item.appendChild(link);
      list.appendChild(item);
    });

    sectionEl.appendChild(list);
    container.appendChild(sectionEl);
  });
}
</script>
</body>
</html>
